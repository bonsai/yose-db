name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'all_graph.html'
      - 'zenza.html'
      - 'graph.html'
      - 'rakugo_zenza.html'
      - 'bin/generate_all_graph'
      - 'db/seeds/kodanshi_2026.yml'
      - 'services/rakugo/data/rakugo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate static API data
        run: ruby bin/generate_all_graph

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp all_graph.html _site/index.html
          cp zenza.html _site/zenza.html
          cp graph.html _site/graph.html
          cp rakugo_zenza.html _site/rakugo_zenza.html
          cp data/all_graph.json _site/data/all_graph.json
          cp data/zenza.json _site/data/zenza.json
          mkdir -p _site/data/rakugo
          cp services/rakugo/data/rakugo/zenza_counts.json _site/data/rakugo/zenza_counts.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4