name: Deploy FE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'all_graph.html'
      - 'bin/generate_all_graph'
      - 'db/seeds/kodanshi_2026.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static FE
        run: |
          mkdir -p _site/data
          ruby bin/generate_all_graph
          cp all_graph.html _site/index.html
          cp data/all_graph.json _site/data/all_graph.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
