<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前座ランキング - yose-db</title>
<style>
  :root { --ink:#1a1a1a; --muted:#666; --line:#e3e3e3; --accent:#b3411f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color:var(--ink); background:#faf7f2; }
  header { background:#2c1a12; color:#f5ead8; padding:20px 24px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:6px 0 0; font-size:13px; color:#cbb89c; }
  main { max-width:860px; margin:0 auto; padding:20px 16px 60px; }
  section { margin-bottom:40px; }
  h2 { font-size:18px; border-left:5px solid var(--accent); padding-left:10px; }
  .note { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; vertical-align:top; }
  th { background:#efe6d8; position:sticky; top:0; }
  td.num, th.num { text-align:right; }
  .rank { font-weight:bold; color:var(--accent); }
  .org { color:var(--muted); font-size:12px; }
  .score { font-weight:bold; }
  .empty { color:var(--muted); }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:16px; }
</style>
</head>
<body>
<header>
  <h1>前座ランキング｜yose-db</h1>
  <p>講談師DB – 今後 前座に特化して加算。ランキングは6軸評価を実装予定(現在は CiNii 話題量の暫定スコア)。</p>
</header>
<main>
  <section id="rankSection">
    <h2>前座ランキング</h2>
    <p class="note">対象は rank=前座 の講談師(現状 講談協会・日本講談協会にのみ存在)。スコア = CiNii Research ヒット数の暫定合計。</p>
    <table id="rankTable">
      <thead><tr><th>#</th><th>名前</th><th>所属</th><th class="num">Score</th></tr></thead>
      <tbody id="rankBody"></tbody>
    </table>
  </section>
  <section id="listSection">
    <h2>全講談師</h2>
    <p class="note">名簿(2026年版・123名)。所属・ランクで色分けはなし、表は簡易版。</p>
    <table>
      <thead><tr><th>名前</th><th>所属</th><th>ランク</th><th>URL</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </section>
</main>
<footer>source: wagei.deci.jp 現役講談師一覧2026年版 / kodankyokai.jp profile</footer>
<script>
(async () => {
  const res = await fetch('/api/v1/kodanshi');
  const data = await res.json();
  const k = data.kodanshi;
  const score = e => (e.obj.cinii && e.obj.cinii.totals && e.obj.cinii.totals.all) || 0;

  const maezashi = k
    .filter(e => e.obj.rank === '前座')
    .sort((a, b) => score(b) - score(a) || a.obj.name.localeCompare(b.obj.name, 'ja'));

  const rankBody = document.getElementById('rankBody');
  rankBody.innerHTML = maezashi.length ? maezashi.map((e, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td>${e.obj.name}</td>
      <td class="org">${e.obj.org || ''}</td>
      <td class="num score">${score(e)}</td>
    </tr>`).join('') : '<tr><td colspan="4" class="empty">前座がいません</td></tr>';

  const listBody = document.getElementById('listBody');
  listBody.innerHTML = k.map(e => `
    <tr>
      <td>${e.obj.name}</td>
      <td class="org">${e.obj.org || ''}</td>
      <td>${e.obj.rank || ''}</td>
      <td>${e.obj.url ? `<a href="${e.obj.url}" target="_blank" rel="noopener">link</a>` : ''}</td>
    </tr>`).join('');
})().catch(e => {
  document.body.insertAdjacentHTML('beforeend', `<p style="color:#b3411f">読み込み失敗: ${e.message}</p>`);
});
</script>
</body>
</html>
