<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yose-db — Ontology Graph</title>
  <style>
    :root { color-scheme: light dark; --bg:#0b1020; --panel:#111827; --text:#e5e7eb; --muted:#9ca3af; --line:#64748b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 20px; border-bottom:1px solid #263247; display:flex; gap:16px; align-items:center; }
    h1 { font-size:18px; margin:0; }
    .sub { color:var(--muted); font-size:13px; }
    main { height:calc(100vh - 61px); position:relative; overflow:hidden; }
    svg { width:100%; height:100%; display:block; }
    .edge { stroke:var(--line); stroke-width:1.5; opacity:.8; }
    .edge-label { fill:var(--muted); font-size:11px; paint-order:stroke; stroke:var(--bg); stroke-width:4px; }
    .node { cursor:pointer; }
    .node circle { stroke:#fff; stroke-opacity:.65; stroke-width:1.5; }
    .node text { fill:var(--text); font-size:13px; font-weight:600; text-anchor:middle; pointer-events:none; }
    .node .type { font-size:10px; font-weight:400; fill:var(--muted); }
    .legend { position:absolute; top:16px; right:16px; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid #263247; border-radius:10px; padding:12px; font-size:12px; line-height:1.8; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
    .info { position:absolute; left:16px; bottom:16px; max-width:380px; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid #263247; border-radius:10px; padding:12px 14px; font-size:12px; display:none; }
    .info strong { display:block; font-size:14px; margin-bottom:4px; }
    .hint { margin-left:auto; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>yose-db / Ontology Graph</h1>
    <span class="sub">寄席芸能オントロジー v0.1.0</span>
    <span class="hint">ノードをクリック</span>
  </header>
  <main>
    <svg id="graph" viewBox="0 0 1200 760" role="img" aria-label="寄席芸能オントロジーの関係グラフ">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
        </marker>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
    <div class="legend">
      <div><span class="dot" style="background:#7c3aed"></span>Event</div>
      <div><span class="dot" style="background:#2563eb"></span>Place</div>
      <div><span class="dot" style="background:#059669"></span>Person</div>
      <div><span class="dot" style="background:#d97706"></span>Art / Organization</div>
      <div><span class="dot" style="background:#64748b"></span>Source / Ticket</div>
    </div>
    <div id="info" class="info"></div>
  </main>
<script>
const nodes = [
  {id:'series', label:'鶴めい七叶亭', type:'EventSeries', kind:'event', x:600, y:170, r:58,
   desc:'東京・九段下の鶴めいホールで毎月開催される、芸歴30年未満の真打21名による会。'},
  {id:'performance', label:'Performance', type:'個別公演', kind:'event', x:600, y:350, r:48,
   desc:'EventSeries に属する個別公演。今後、日付・出演者・演目を実データ化する。'},
  {id:'venue', label:'鶴めいホール', type:'Venue', kind:'place', x:360, y:350, r:52,
   desc:'〒102-0072 東京都千代田区飯田橋2丁目5-4'},
  {id:'performer', label:'Performer', type:'演者', kind:'person', x:840, y:350, r:45,
   desc:'落語家・講談師・浪曲師などの出演者。'},
  {id:'rakugo', label:'落語', type:'ArtForm', kind:'art', x:390, y:540, r:38, desc:'ArtForm'},
  {id:'kodan', label:'講談', type:'ArtForm', kind:'art', x:600, y:540, r:38, desc:'ArtForm'},
  {id:'rokyoku', label:'浪曲', type:'ArtForm', kind:'art', x:810, y:540, r:38, desc:'ArtForm'},
  {id:'org', label:'Organization', type:'団体', kind:'art', x:180, y:170, r:44, desc:'公演を組織・運営する団体。'},
  {id:'ticket', label:'Ticket', type:'入場券', kind:'source', x:1020, y:170, r:40, desc:'料金・予約・支払方法などの入場情報。'},
  {id:'official', label:'公式サイト', type:'Source', kind:'source', x:950, y:570, r:40, desc:'https://nanokatei.official.ec/'},
  {id:'association', label:'講談協会', type:'Source', kind:'source', x:1050, y:650, r:40, desc:'https://kodankyokai.jp/'}
];

const edges = [
  ['performance','series','partOfSeries'],
  ['series','venue','hasVenue'],
  ['performance','venue','occursAt'],
  ['performance','performer','hasPerformer'],
  ['series','rakugo','hasArtForm'],
  ['series','kodan','hasArtForm'],
  ['series','rokyoku','hasArtForm'],
  ['series','org','organizedBy'],
  ['series','ticket','hasTicket'],
  ['series','official','supportedBy'],
  ['series','association','supportedBy']
];

const colors = {event:'#7c3aed',place:'#2563eb',person:'#059669',art:'#d97706',source:'#64748b'};
const svg = document.querySelector('#graph');
const edgeLayer = document.querySelector('#edges');
const nodeLayer = document.querySelector('#nodes');
const info = document.querySelector('#info');
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));

function line(a,b) {
  const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
  const x1=a.x+dx/d*a.r, y1=a.y+dy/d*a.r;
  const x2=b.x-dx/d*b.r, y2=b.y-dy/d*b.r;
  return {x1,y1,x2,y2,mx:(x1+x2)/2,my:(y1+y2)/2};
}

for (const [from,to,label] of edges) {
  const a=byId[from], b=byId[to], p=line(a,b);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('class','edge'); l.setAttribute('marker-end','url(#arrow)');
  l.setAttribute('x1',p.x1); l.setAttribute('y1',p.y1); l.setAttribute('x2',p.x2); l.setAttribute('y2',p.y2);
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('class','edge-label'); t.setAttribute('x',p.mx); t.setAttribute('y',p.my-5); t.setAttribute('text-anchor','middle'); t.textContent=label;
  g.append(l,t); edgeLayer.append(g);
}

for (const n of nodes) {
  const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','node'); g.dataset.id=n.id;
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',n.r); c.setAttribute('fill',colors[n.kind]);
  const text=document.createElementNS('http://www.w3.org/2000/svg','text'); text.setAttribute('x',n.x); text.setAttribute('y',n.y+4); text.textContent=n.label;
  const type=document.createElementNS('http://www.w3.org/2000/svg','text'); type.setAttribute('class','type'); type.setAttribute('x',n.x); type.setAttribute('y',n.y+n.r+15); type.textContent=n.type;
  g.append(c,text,type); g.addEventListener('click',()=>showInfo(n)); nodeLayer.append(g);
}
function showInfo(n){ info.style.display='block'; info.innerHTML=`<strong>${n.label}</strong><span>${n.type}</span><br>${n.desc}`; }
</script>
</body>
</html>
