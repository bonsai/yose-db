<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全講談師グラフ - yose-db</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b6259; --line:#e6ddd2; --bg:#faf7f2; --card:#fff; --accent:#b3411f; --k1:#8a2f15; --k2:#c06a2c; --k3:#2e6b50; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:linear-gradient(135deg,#2c1a12,#4a2c1c); color:#f5ead8; padding:22px 24px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:6px 0 0; font-size:13px; color:#cdb99e; }
  header a { color:#e8c98a; }
  main { max-width:960px; margin:0 auto; padding:20px 16px 50px; }
  .cards { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .card { flex:1 1 130px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; }
  .card .k { font-size:12px; color:var(--muted); }
  .card .v { font-size:20px; font-weight:bold; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .k1{background:var(--k1);} .k2{background:var(--k2);} .k3{background:var(--k3);}
  .org { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .org h2 { margin:0 0 4px; font-size:17px; }
  .org .sub { font-size:12px; color:var(--muted); margin-bottom:10px; word-break:break-all; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:16px; padding:3px 10px; font-size:13px; background:#fbf8f2; }
  .chip a { color:inherit; text-decoration:none; }
  .chip a:hover { text-decoration:underline; }
  .chip.前座 { border-color:var(--k3); background:#eaf4ee; }
  .badge { font-size:10px; padding:1px 5px; border-radius:8px; color:#fff; }
  .b-真打{background:var(--k1);} .b-二ツ目{background:var(--k2);} .b-前座{background:var(--k3);}
  .empty { color:var(--muted); }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:18px; }
</style>
</head>
<body>
<header>
  <h1>全講談師グラフ</h1>
  <p>2026年版 現役講談師 123名(5団体+無所属)の所属グラフ。データ: <a href="./data/all_graph.json">data/all_graph.json</a>(静的API)｜<a href="./zenza.html">前座ランキングへ</a></p>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="legend">
    <span><i class="k1"></i>真打</span><span><i class="k2"></i>二ツ目</span><span><i class="k3"></i>前座</span>
  </div>
  <div id="orgs"></div>
</main>
<footer>source: wagei.deci.jp 現役講談師一覧2026年版 / kodankyokai.jp profile</footer>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async () => {
  const res = await fetch('./data/all_graph.json');
  const g = await res.json();
  const { member_count, organization_count, build_at } = g.meta;
  const ranks = g.ranks;
  const cards = [
    ['講談師', member_count], ['団体', organization_count],
    ['真打', ranks['真打']], ['二ツ目', ranks['二ツ目']], ['前座', ranks['前座']],
  ].map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('cards').innerHTML = cards;

  const orgsByType = {};
  const members = g.nodes.filter(n => n.type === 'member');
  for (const org of g.nodes.filter(n => n.type === 'organization')) {
    if (!orgsByType[org.id]) orgsByType[org.id] = { org, members: [] };
  }
  for (const m of members) orgsByType[m.organization].members.push(m);
  const orgList = Object.values(orgsByType).sort((a, b) => b.members.length - a.members.length);

  document.getElementById('orgs').innerHTML = orgList.map(({ org, members: ms }) => `
    <div class="org">
      <h2>${esc(org.name)} <small style="font-size:12px;color:var(--muted)">(${ms.length})</small></h2>
      ${org.url ? `<div class="sub"><a href="${esc(org.url)}" target="_blank" rel="noopener">${esc(org.url)}</a></div>` : '<div class="sub">無所属</div>'}
      <div class="chips">
        ${ms.map(m => `
          <span class="chip ${esc(m.rank || '')}">
            <span class="badge b-${esc(m.rank || 'none')}">${esc(m.rank || '—')}</span>
            ${m.profile_url ? `<a href="${esc(m.profile_url)}" target="_blank" rel="noopener">${esc(m.name)}</a>` : esc(m.name)}
          </span>`).join('')}
      </div>
    </div>`).join('');

  document.querySelector('header p').insertAdjacentHTML('beforeend', ` ｜ 生成: ${esc(build_at && build_at.slice(0, 10))}`);
})().catch(e => { document.getElementById('orgs').innerHTML = `<p class="empty">読込失敗: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
